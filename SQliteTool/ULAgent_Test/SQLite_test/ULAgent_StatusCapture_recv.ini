; ULAgent Status API single-capture settings
; Configure this file for the PC on which the script is placed.

; Sender example:   Target=Sender
; Receiver example: Target=Receiver
Target=Receiver

; Sender standard URL:   http://127.0.0.1:5080
; Receiver standard URL: http://127.0.0.1:5081
BaseUrl=http://127.0.0.1:5081

; Sender:   /api/transfers
; Receiver: /api/receives
RecordsPath=/api/receives

; Allowed range: 1 to 500
Limit=500

; Relative paths are resolved from the script directory.
OutputDirectory=Evidence
